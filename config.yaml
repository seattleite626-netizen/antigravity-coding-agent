# Default configuration file for antigravity coding agent
agent:
  name: "Antigrav Coding Agent"
  version: "1.0.0"
  description: "AI-powered coding assistant for the antigravity platform"

# AI Model Configuration
models:
  default: "openai"
  openai:
    api_key: "YOUR_OPENAI_API_KEY"
    model: "gpt-4"
    max_tokens: 2048
    temperature: 0.7
  groq:
    api_key: "YOUR_GROQ_API_KEY"
    model: "llama-3.3-70b-versatile"
    max_tokens: 2048
    temperature: 0.7
  composio:
    api_key: "YOUR_COMPOSIO_API_KEY"
    base_url: "https://backend.composio.dev"

# Project Settings
project:
  default_dir: "./projects"
  templates_dir: "./templates"
  auto_backup: true
  backup_interval: 300  # seconds

# Plugin Configuration
plugins:
  enabled: true
  auto_load: true
  plugin_dir: "./plugins"
  
# Logging Configuration
logging:
  level: "INFO"
  file: "antigrav.log"
  console: true
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# Interface Settings
interface:
  prompt: "🚀 antigrav> "
  colors: true
  auto_complete: true
  history_size: 1000